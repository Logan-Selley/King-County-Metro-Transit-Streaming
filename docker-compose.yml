# transit-stream -- local development stack
#
# ${VAR} below is substituted from .env in this directory, which Compose reads
# implicitly. See .env.example for the required keys. Substitution only: these
# values reach the containers via `environment:`, not by injecting the file.
#
# --- THREE CONSTRAINTS SHAPE THIS WHOLE FILE ---
#
# 1. EVERY persistent volume is a HOST BIND MOUNT under /mnt/F/docker-data,
#    never a named volume. Named volumes live under /var/lib/docker on the
#    root filesystem, which is a 293G partition sitting at 96% with ~15G free.
#    This stack's whole purpose is to accumulate event data continuously; a
#    24-hour Phase 1 collection run pointed at /var/lib/docker would fill the
#    root partition and take the desktop down with it. /mnt/F is 3.6T of ext4.
#
# CORRECTION, 2026-09-20: the 96% figure above is HISTORICAL. The root
# filesystem is now a different device (/dev/sdc2, 639G) with 414G free at
# 36%. The bind mounts stay, because a stack that accumulates event data
# continuously still does not belong on the OS partition and /mnt/F has 2.8T
# -- but the emergency framing no longer applies, and the disk objection must
# not be cited against new components (it was retired in ADR 0006).
#
#    The parcel project hit this first and moved its warehouse the same way.
#    Only the volumes move, not Docker's data-root -- relocating the daemon's
#    storage would mean dropping nosuid,nodev from /mnt/F in fstab, and nodev
#    breaks image extraction for images shipping device nodes.
#
#    Image LAYERS still land on the root partition. That is the argument for
#    the `connect` profile below, not just tidiness.
#
# 2. PORTS ROUTE AROUND THE PARCEL PROJECT, which may be running at the same
#    time. It holds 5433 (its warehouse) and 8080 (its Airflow webserver).
#    Nothing here may claim either. The external-port convention is to prefix
#    the conventional port with 1 (9092 -> 19092, 8081 -> 18081), which keeps
#    them mnemonic while guaranteeing no clash with a default-configured
#    Kafka or Schema Registry a tutorial might have you start.

# 3. EVERY SERVICE IS MEMORY-CAPPED, and this one is new. It is the reason the
#    machine used to come back rebooted.
#
#    Nothing here had a limit, so any runaway -- Redpanda's cache, the
#    TaskManager, Connect during a replay -- could take the whole host instead
#    of being killed inside its own cgroup. Measured 2026-09-23, stack idle:
#    31Gi total, 20Gi used, 10Gi available, 3.3Gi of zram swap in use. The
#    stack was the smaller half of that (containers ~4.7G: redpanda 1.7,
#    taskmanager 1.3, jobmanager 0.8, connect 0.5, minio 0.3, warehouse 0.2)
#    against an IDE and browser above it (PyCharm ~6.9G).
#
#    `memswap_limit` is set equal to `mem_limit` everywhere so a container
#    cannot swap at all. Swap here is zram, which is compressed RAM: a
#    container thrashing it does not slow down, it freezes the desktop, and
#    the kernel's OOM killer never runs because no allocation ever fails.
#    That is consistent with the two boots that ended with no OOM record and
#    no panic (checked: no oom-kill, no systemd-oomd, /sys/fs/pstore empty).
#
#    These are LIMITS, not reservations, so the idle footprint is unchanged.
#    The one number that follows a hard rule is the TaskManager's: it must
#    exceed taskmanager.memory.process.size (6g, explained in its own comment)
#    or Flink refuses to start, which is why it is 7g and not less.

name: transit-stream

services:
  # --- event bus ------------------------------------------------------------
  # Redpanda, not Kafka. Rationale is in docs/decisions/0001-redpanda-over-kafka.md;
  # the short version is one binary, no ZooKeeper, no separate KRaft controller,
  # and a Kafka-API-compatible wire protocol so every client library is unchanged.
  #
  # It also ships a Schema Registry ON THE SAME BINARY (port 8081 internally).
  # That removes an entire Confluent container from this file. Phase 2 registers
  # protobuf schemas against it with the ordinary confluent-kafka client -- the
  # registry API is compatible, so this is a deployment simplification and not
  # a capability compromise.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    container_name: transit_redpanda
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    command:
      - redpanda
      - start
      # Two listeners, and BOTH are load-bearing. `internal` is what other
      # containers use (redpanda:9092). `external` is what processes on the
      # host use (localhost:19092). A single listener cannot serve both:
      # Kafka clients bootstrap by connecting once, then RECONNECT to whatever
      # address the broker advertises. Advertise `redpanda:9092` and a producer
      # running on the host resolves nothing; advertise `localhost:19092` and
      # a container connects to itself. This is the single most common way a
      # local Kafka stack appears to work and then hangs on first produce.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      # dev-container mode: single node, no fsync-per-write, relaxed memory
      # checks. Correct for a laptop and WRONG for anything real -- it trades
      # the durability guarantee for not needing a tuned host. Named here so
      # the trade is visible rather than inherited from a tutorial.
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_REGISTRY_PORT:-18081}:18081"
      - "${REDPANDA_PROXY_PORT:-18082}:18082"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - /mnt/F/docker-data/transit-redpanda:/var/lib/redpanda/data
    healthcheck:
      # `rpk cluster health` reports the cluster as a whole, not just that the
      # process is up. Connect and the producers both gate on this, because a
      # broker accepting TCP before it has a leader for the controller
      # partition will reject topic creation.
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- broker UI ------------------------------------------------------------
  # Not decoration. Phase 1's exit criterion is 24 hours of uninterrupted
  # collection, and the thing that makes that verifiable at a glance is a
  # consumer-lag and partition view. Reading it out of `rpk` works but is a
  # worse feedback loop when the question is "did anything stall overnight".
  console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: transit_console
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      # Console reads a YAML config; every key is also settable as an env var
      # by upper-snake-casing its path. Both the v2 (`KAFKA_SCHEMAREGISTRY_*`)
      # and v3 (`SCHEMAREGISTRY_*`) spellings are set because the key moved to
      # the top level in v3 and pinning one spelling silently disables the
      # schema view on the other major version -- the UI still loads, it just
      # shows protobuf payloads as raw bytes, which looks like a serializer bug.
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      # 8085, because 8080 is the parcel project's Airflow webserver.
      - "${CONSOLE_PORT:-8085}:8080"

  # --- serving layer --------------------------------------------------------
  # Same image as the parcel project deliberately: the container patterns,
  # the initdb convention, and the shm_size lesson all transfer, and there is
  # no reason for two projects on one machine to debug two Postgres versions.
  warehouse:
    image: postgis/postgis:16-3.4
    container_name: transit_warehouse
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5434 on the host: 5433 is the parcel warehouse, 5432 is a native
      # install if one ever appears.
      - "${WAREHOUSE_PORT:-5434}:5432"
    volumes:
      # chown 999:999, chmod 700 before first start or postgres refuses to
      # initialize -- it checks PGDATA ownership against its own uid. `make
      # dirs` does this.
      - /mnt/F/docker-data/transit-warehouse:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 1gb  # spatial joins and large sorts exhaust the 64mb default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- raw archive ----------------------------------------------------------
  # Every poll response lands here untouched before it is decoded. This is the
  # replay story, and per the proposal it is also the insurance policy: the
  # Terms of Use explicitly reserve King County's right to modify or
  # discontinue access without notice, so the archive is what makes the
  # project survive the feed disappearing.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: transit_minio
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - /mnt/F/docker-data/transit-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Bucket creation MOVED TO TERRAFORM, build step 5B. terraform/core/storage.tf
  # owns transit-raw, including its lifecycle rule for abandoned checkpoints.
  #
  # WHY IT MOVED. This was a one-shot bucket create with an ignore-if-exists
  # flag: create if absent, say nothing about configuration. Same shape as the
  # topic-create calls that used to be in the Makefile, and it went for the same
  # reason. The bucket grew configuration worth managing (an expiry on
  # flink-checkpoints/), and there should be one owner for it.
  #
  # The bootstrap sequence on a fresh machine is now `make up` then
  # `make platform`, which is what CI's platform job proves on every push.
  # tests/test_platform_contract.py fails while a bucket-create call appears in
  # this file -- a blunt substring check, so this comment cannot quote it
  # either.

  # --- ingest and enrichment (supervised) -----------------------------------
  # BEHIND A PROFILE, because `make up` is infrastructure and these are the
  # feed. `make stream-up` starts them; the restart policy is what keeps them
  # alive afterwards, because a profile governs STARTING, not restarting, so
  # they come back on a boot without the profile being named again.
  #
  # WHY CONTAINERS AT ALL. Both used to be started from a terminal (`make
  # produce`, `make enrich`), so they died with the session that started them.
  # Two of the gaps in the warehouse are exactly that shape -- see the
  # 1,062-minute run in mart_feed_health -- and the mart cannot tell our
  # downtime from Metro's. Dockerfile.pipeline has the long version.
  #
  # The environment below is passed explicitly and the container does NOT read
  # .env, because every value in there is host-facing: localhost:19092,
  # localhost:18081, localhost:9000. None of those resolve inside the network.
  # It is the mirror image of the redpanda listener trap -- a client
  # bootstraps once and then reconnects to whatever the broker ADVERTISES, so
  # an internal client told `localhost` connects to itself.
  producer:
    profiles: ["stream"]
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: transit-pipeline:0.1.0
    container_name: transit_producer
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      MINIO_ENDPOINT: minio:9000
      # archive_writer, not MINIO_ROOT_USER (build step 5C). The policy is
      # ListBucket on the bucket plus PutObject under raw/ and nothing else, so a
      # bad producer cannot read the archive back or touch flink-checkpoints/.
      MINIO_ACCESS_KEY: archive_writer
      MINIO_SECRET_KEY: ${ARCHIVE_WRITER_SECRET}
      RAW_BUCKET: ${RAW_BUCKET:-transit-raw}
      # Carried through from .env because these are policy, not addresses.
      # The user agent is the good-citizen contact on a public endpoint, and
      # the poll intervals are half Metro's measured publish period.
      FEED_USER_AGENT: ${FEED_USER_AGENT}
      POLL_INTERVAL_VEHICLE_POSITIONS: ${POLL_INTERVAL_VEHICLE_POSITIONS}
      POLL_INTERVAL_TRIP_UPDATES: ${POLL_INTERVAL_TRIP_UPDATES}
      POLL_INTERVAL_SERVICE_ALERTS: ${POLL_INTERVAL_SERVICE_ALERTS}
    # No --duration. The process has to run until something stops it, which is
    # the whole point of giving it a restart policy.
    command: ["python", "-m", "producer.run"]
    healthcheck:
      # Reports whether the loop is still TICKING, which the restart policy
      # cannot: a wedged process stays Up. producer/heartbeat.py touches this
      # file once an iteration and documents what it does not prove (nothing
      # about whether Metro is publishing).
      #
      # -mmin rather than arithmetic on stat, so there is no $ to escape for
      # Compose.
      test: ["CMD-SHELL", "find /tmp/transit-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      # The file does not exist until the first iteration.
      start_period: 60s

  enrichment:
    profiles: ["stream"]
    image: transit-pipeline:0.1.0
    container_name: transit_enrichment
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      redpanda:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      # psycopg is enrichment-only, so the database credentials are here and
      # deliberately NOT on the producer above.
      #
      # The enrichment role, not the superuser (build step 5C): it reads static.*
      # and nothing else. POSTGRES_USER and POSTGRES_PASSWORD are absent on
      # purpose, so this container cannot log in as `transit`.
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      ENRICHMENT_PASSWORD: ${ENRICHMENT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # --schema-version 2, NOT the CLI default of 1, and this is a measured
    # choice: a live record off the enriched topic carries
    # neighborhood_name 'South Beacon Hill' and neighborhood_num 91, which
    # only enrich_v2 populates, and stg_vehicle_positions selects
    # neighborhood_name to build the mart. Run this as v1 and the warehouse
    # quietly starts receiving a thinner payload than the 2.79M rows already
    # in it. Note `make enrich` defaults to V=1, which is the trap this line
    # exists to close.
    command: ["python", "-m", "consumers.enrichment.run", "--schema-version", "2"]
    healthcheck:
      # Same liveness file as the producer, same reasoning: the enrichment loop
      # can be Up and wedged, and this is the only thing that notices. It says
      # nothing about whether records are flowing, which is dbt source
      # freshness's job.
      test: ["CMD-SHELL", "find /tmp/transit-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- stateful processing (Phase 3) ---------------------------------------
  # BEHIND A PROFILE, like connect. `make flink-up` starts them.
  #
  #     docker compose --profile flink up -d
  #
  # Two containers because that is Flink's actual topology: the JobManager
  # coordinates and hosts the UI, TaskManagers execute. Running one combined
  # process would hide the distinction the phase exists to demonstrate.
  #
  # Job code is NOT mounted from the project venv -- ADR 0006. apache-flink
  # pins protobuf<6 through apache-beam, and the project runs protobuf 7.36.1;
  # sharing the environment silently downgrades it and breaks recon/probe.py.
  # Jobs are mounted as plain source and run against the image's own Python.
  flink-jobmanager:
    profiles: ["flink"]
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: transit-pyflink:2.2.0
    container_name: transit_flink_jm
    command: jobmanager
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # rpc.address must match the service name or TaskManagers cannot
      # register, and the failure looks like "no slots available" rather than
      # a connectivity error.
      #
      # state.checkpoints.dir is what makes checkpointing mean anything.
      # Without it, checkpoints live in JobManager memory: they survive a
      # TaskManager crash (the case job.py's docstring describes) but NOT a
      # JobManager restart, and `make flink-up --build` is a JobManager
      # restart. The detector would then silently refill state from an empty
      # start and under-report until every vehicle reappeared.
      #
      # CORRECTED 2026-09-22: a durable directory alone does not deliver
      # that. Two more things are true and both bit:
      #
      #   * Flink's default retention is NO_EXTERNALIZED_CHECKPOINTS, which
      #     DELETES a job's checkpoints when the job terminates. The bunching
      #     job completed checkpoint 1750 at 20:35:38 UTC, the JobManager took
      #     a SIGTERM 13s later, and MinIO held nothing afterwards.
      #     RETAIN_ON_CANCELLATION below keeps them.
      #
      #   * There is no JobManager HA, so a restarted JobManager logs
      #     "Successfully recovered 0 persisted job graphs" and the job is
      #     simply gone. Retained checkpoints make it RESUMABLE, by hand:
      #       flink run -s s3://transit-raw/flink-checkpoints/<job>/chk-N ...
      #     They do not make it automatic. That needs HA, which for a
      #     single-node laptop stack is more machinery than it is worth.
      #
      # MinIO rather than a new dependency -- it is already in the stack for
      # the raw archive and speaks S3. path.style.access is mandatory for it:
      # the AWS default is virtual-host addressing (bucket.host), which does
      # not resolve against a container named `minio`.
      #
      # DO NOT QUOTE `true` HERE, unlike every other boolean in this file.
      # FLINK_PROPERTIES is a YAML block scalar, so its contents are copied
      # into Flink's config.yaml verbatim -- quotes and all. Written as
      # "true", Flink logs `s3.path.style.access, "true"` and does not read it
      # as a boolean, so addressing stays virtual-host and the checkpoint
      # hangs rather than failing: total 2, completed 0, in_progress 1, and no
      # error anywhere in the logs. The `environment:` values elsewhere in
      # this file need their quotes because Compose passes those to the
      # container; these are not the same thing.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 3
        state.backend: hashmap
        execution.checkpointing.interval: 30s
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        state.checkpoints.dir: s3://${RAW_BUCKET:-transit-raw}/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: flink_state
        s3.secret-key: ${FLINK_STATE_SECRET}
    ports:
      - "${FLINK_UI_PORT:-8086}:8081"
    volumes:
      - ./consumers:/opt/jobs/consumers:ro
      - ./schemas:/opt/jobs/schemas:ro
    healthcheck:
      # The REST API, not the process. An Up JobManager whose web or Pekko layer
      # is broken cannot serve the UI or accept a submit, and this is what
      # flink-submit now waits for (see its depends_on), so the curl loop inside
      # flink-submit.sh becomes the fallback rather than the mechanism.
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  flink-taskmanager:
    profiles: ["flink"]
    image: transit-pyflink:2.2.0
    container_name: transit_flink_tm
    command: taskmanager
    restart: unless-stopped
    # MUST EXCEED taskmanager.memory.process.size BELOW (6g). Flink checks the
    # requested process size against the container's cgroup limit and refuses
    # to start when it does not fit, so capping this at the measured 1.3G
    # would trade a freeze for a cluster that never comes up. 7g leaves 1g for
    # the JVM's own overhead outside the accounting.
    mem_limit: 7g
    memswap_limit: 7g
    depends_on:
      - flink-jobmanager
    environment:
      # The S3 settings are repeated rather than shared. TaskManagers write
      # checkpoint state themselves -- only the metadata goes through the
      # JobManager -- so a TaskManager without credentials fails at the first
      # checkpoint, ~30s in, long after the job looks healthy.
      # jvm-metaspace defaults to 256m, which is enough for a cluster that
      # runs one job and too little for one that a developer submits to
      # repeatedly. Each submission loads the job's classes into a fresh
      # ChildFirstClassLoader, and PyFlink drags in Beam, so metaspace grows
      # per submit. Measured here after roughly a dozen submits in one
      # session:
      #
      #   java.lang.OutOfMemoryError: Metaspace ... The task executor has to
      #   be shutdown...
      #
      # It kills the TaskManager, not the job, so the symptom is a job that
      # was healthy a moment ago sitting in RESTARTING with no exception of
      # its own. `restart: unless-stopped` brings the container back and the
      # job recovers from its last checkpoint, which masks it further.
      #
      # 9 slots and 6g, sized for both jobs at once: bunching at parallelism
      # 3 (its topic's partition count) plus prediction at 6 (raw.trip_updates'
      # count). Parallelism is a correctness setting here -- see
      # consumers/bunching/job.py -- so the slots follow from the topics.
      #
      # The memory follows from PyFlink. Python workers draw on Flink's
      # MANAGED memory (python.fn-execution.memory.managed is on by default),
      # which is ~40% of what is left after metaspace and JVM overhead. At the
      # old 1728m that was ~410 MB shared across every slot, ~45 MB each for a
      # Python worker running Beam. At 6g it is ~2 GB, ~225 MB a slot.
      #
      # task.off-heap is the one that crashed. The JVM and each Python worker
      # talk over Beam's gRPC, whose Netty buffers are DIRECT memory, and
      # the default direct budget is Flink's network buffers plus a 128m
      # framework allowance -- MaxDirectMemorySize came to ~630 MB, most of it
      # already spoken for. With both jobs submitted (nine slots of Python
      # workers) the prediction job died within 25s on:
      #
      #   java.lang.OutOfMemoryError: Direct buffer memory ... The task
      #   executor has to be shutdown...
      #
      # and because it is the TASKMANAGER that shuts down, it took the
      # healthy bunching job with it. 1g of task off-heap is carved out of
      # the 6g and adds straight onto MaxDirectMemorySize.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 9
        taskmanager.memory.process.size: 6g
        taskmanager.memory.task.off-heap.size: 1g
        taskmanager.memory.jvm-metaspace.size: 512m
        state.checkpoints.dir: s3://${RAW_BUCKET:-transit-raw}/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: flink_state
        s3.secret-key: ${FLINK_STATE_SECRET}
    volumes:
      - ./consumers:/opt/jobs/consumers:ro
      - ./schemas:/opt/jobs/schemas:ro
    healthcheck:
      # A TaskManager has no HTTP endpoint of its own (measured: it listens on
      # exactly one port, its data port), so its health is asked of the
      # JobManager: is a TaskManager registered? An unregistered worker cannot
      # run anything, so "unhealthy" is truthful rather than harsh here.
      #
      # The consequence to know: a down JobManager reports its TaskManager
      # unhealthy as well. With one worker that coupling is correct; with
      # several it would not be, and this check would need replacing.
      test: ["CMD-SHELL", "curl -fs http://flink-jobmanager:8081/taskmanagers | grep -q dataPort"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Submits the jobs once, and re-submits after a restart. There is no
  # JobManager HA (see the jobmanager comment above), so without this a boot
  # leaves the cluster running and empty -- which looks identical to a healthy
  # cluster with a quiet feed.
  #
  # 1024m, and the number is measured: at 256m the container's cgroup pinned
  # its limit (memory.peak == memory.max, 90 max events) and `flink run` came
  # back "Killed". It is a JVM plus a Python process building the job graph,
  # which is the same shape as the JobManager, so it gets a comparable budget
  # rather than a rounding error. Worth noting what that failure looked like:
  # the container died and the host did not, which is the whole point of
  # capping these.
  #
  # The script is idempotent by job name and explains why resuming from a
  # retained checkpoint stays manual: docker/flink-submit.sh.
  flink-submit:
    profiles: ["flink"]
    image: transit-pyflink:2.2.0
    container_name: transit_flink_submit
    restart: unless-stopped
    mem_limit: 1024m
    memswap_limit: 1024m
    depends_on:
      flink-jobmanager:
        # service_healthy, not service_started. The script polls the REST API
        # itself, so this is belt and braces, but it is the correct declaration:
        # a submit against a half-started cluster fails outright, and the curl
        # loop inside flink-submit.sh becomes the fallback rather than the only
        # guard.
        condition: service_healthy
    environment:
      # On by default. Both sources start at latest(), so submitting the
      # prediction job on boot costs no replay; it was off by default on the
      # mistaken belief that it read 47M records from earliest. Set it to 0 to
      # run the detector alone.
      FLINK_AUTOSUBMIT_PREDICTION: ${FLINK_AUTOSUBMIT_PREDICTION:-1}
    volumes:
      # The same mounts the flink run needs, because --pyFiles packages from
      # here. The script is mounted at /opt outside them so it does not end up
      # in the shipped Python archive.
      - ./consumers:/opt/jobs/consumers:ro
      - ./schemas:/opt/jobs/schemas:ro
      - ./docker/flink-submit.sh:/opt/flink-submit.sh:ro
    # `sleep infinity` rather than a bare script. A container that exits is
    # finished as far as compose is concerned; staying up means a compose
    # restart re-runs the submit pass, which is how this recovers after a
    # reboot without any host-side unit. The script is idempotent, so the
    # re-run costs one `flink list`.
    #
    # `bash /opt/flink-submit.sh`, NOT the bare path: the script is bind-mounted
    # from /mnt/F, an NTFS mount, where the executable bit does not survive.
    # Executing it directly gave "Permission denied" and a restart loop --
    # which is the restart policy doing its job on a fixable mistake. Naming
    # the interpreter sidesteps the file mode entirely.
    command: ["/bin/bash", "-c", "bash /opt/flink-submit.sh && exec sleep infinity"]

  # --- sink -----------------------------------------------------------------
  # BEHIND A PROFILE, so `docker compose up -d` does not pull it.
  #
  # cp-kafka-connect is ~1.5 GB of image layers, and image layers land on the
  # root partition that is already at 96%. Phase 1 needs Redpanda, MinIO and
  # the warehouse running for a 24-hour collection; it does not need Connect
  # until there is something worth sinking. Start it explicitly:
  #
  #     docker compose --profile connect up -d
  #
  # It talks to Redpanda over the Kafka protocol like any other client -- that
  # Connect is a Confluent image pointed at a non-Confluent broker is exactly
  # the API-compatibility claim in ADR 0001, tested rather than asserted.
  connect:
    profiles: ["connect"]
    # Built, not pulled: the stock image has no JDBC sink and a protobuf-java
    # ordering bug that breaks its own ProtobufConverter. Both are explained
    # in docker/Dockerfile.connect.
    build:
      context: .
      dockerfile: docker/Dockerfile.connect
    image: transit-connect:7.7.1
    container_name: transit_connect
    restart: unless-stopped
    # 2560m rather than the measured 484M: the Confluent image's launcher sets
    # KAFKA_HEAP_OPTS to -Xms256M -Xmx2G, so a limit under 2G would OOM-kill
    # Connect the first time a replay fills the heap, which is exactly when its
    # failure is least welcome.
    mem_limit: 2560m
    memswap_limit: 2560m
    depends_on:
      redpanda:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      # THE IMAGE'S OWN HEALTHCHECK READS THIS, and leaving it unset is why
      # `connect-status` used to report the container UNHEALTHY for its whole
      # life while the worker and all three tasks were fine.
      # /etc/confluent/docker/healthcheck.sh curls
      #   http://$CONNECT_REST_ADVERTISED_HOST_NAME:$CONNECT_REST_PORT/connectors
      # and without the port that url is "http://connect:/connectors": curl
      # answers 000, the script exits 1, and Docker retries it forever.
      # Measured inside the container: 000 without the port, 200 with it.
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: transit-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      # Single broker, so the internal topics cannot be replicated. Defaults
      # are 3 and Connect refuses to start against a one-node cluster.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.protobuf.ProtobufConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      # Secrets stay out of connector configs. EnvVarConfigProvider lets a
      # config say "${env:CONNECT_SINK_PASSWORD}" and resolves it inside the
      # worker, so connect/*.json is committed with no credential in it and
      # the password never appears in the REST API's view of the config.
      #
      # THE SINK'S OWN ROLE, not the superuser (build step 5C). POSTGRES_USER and
      # POSTGRES_PASSWORD are deliberately NOT in this environment, so the worker
      # cannot log in as `transit` even if a config asked it to. POSTGRES_DB stays,
      # because the JDBC URL names the database and a database name is not a
      # credential.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_SINK_PASSWORD: ${CONNECT_SINK_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${CONNECT_PORT:-8083}:8083"
    volumes:
      - ./connect:/etc/transit-connect:ro

# No named volumes, by design. See the header.
