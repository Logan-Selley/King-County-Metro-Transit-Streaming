# Every value from the environment, none committed. The credentials are
# role-specific rather than the superuser's: dbt logs in as
# `dbt_transform`, which reads raw.* and static.* and OWNS staging.* and marts.*.
# That ownership is the point: `create or replace` needs it, and the role that has
# it can still not drop a landing table.
#
# DBT_HOST defaults to `warehouse`, the compose service name: dbt runs in its
# own container on the compose network (make dbt, or Airflow's
# DockerOperator), never on the host. From the host it would be localhost and
# the mapped port, which is the kind of split that works on one machine and
# nowhere else.
transit_stream:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'warehouse') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: staging
      threads: 4
